# 出租专用；仅包含现有出租身份。未发布，不改变已发出的固定 VLESS 链接。
# IPv6 入口已在当前电脑实测；原 IPv4 入口当前本地不可达。
# 双入口/自动回退不会使 IPv4-only 网络自动获得可达入口。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
proxies:
  - name: "美国-出租-IPv6入口"
    type: vless
    server: "2600:1f14:1172:5f00:c491:6b50:62b4:c931"
    port: 443
    uuid: "3a819840-2844-436c-8650-ac6b11f70660"
    network: tcp
    udp: false
    tls: true
    flow: "xtls-rprx-vision"
    servername: "www.microsoft.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "zyTOrYSLMmN8aBb_-QWGr58VkDR-9L80AwCzpxeFTSY"
      short-id: "7c59504333892d97"
  - name: "美国-出租-原IPv4入口（当前本地不可达）"
    type: vless
    server: "54.71.51.243"
    port: 443
    uuid: "3a819840-2844-436c-8650-ac6b11f70660"
    network: tcp
    udp: false
    tls: true
    flow: "xtls-rprx-vision"
    servername: "www.microsoft.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "zyTOrYSLMmN8aBb_-QWGr58VkDR-9L80AwCzpxeFTSY"
      short-id: "7c59504333892d97"
proxy-groups:
  - name: 美国出租自动
    type: fallback
    proxies:
      - "美国-出租-IPv6入口"
      - "美国-出租-原IPv4入口（当前本地不可达）"
    url: 'https://www.google.com/generate_204'
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
rules:
  - MATCH,美国出租自动
