    port: 443
    uuid: 3447fe7d-c5a2-4dbb-983b-960dc08ee122
    network: tcp
    tls: true
    udp: false
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: zyTOrYSLMmN8aBb_-QWGr58VkDR-9L80AwCzpxeFTSY
      short-id: 7c59504333892d97

proxy-groups:
  - name: PROXY
    type: select
    proxies:
