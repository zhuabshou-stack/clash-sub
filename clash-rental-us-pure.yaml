# 出租专用；仅出租身份；固定 IPv6 VLESS 保持原样。
# 2026-11-01 新 IPv4 已通过本次 Xray/Mihomo 有界传输检查；不代表所有网站或长期稳定性已验收。
# 自动优先使用新 IPv4，IPv6 保留作备用；UDP 仍按原配置关闭。
